# ===============================
# JPA (solo para datasource principal)
# ===============================

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# ✅ Propiedades específicas para SQL Server y fechas
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# Forzar uso de tipos de fecha modernos
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=93
spring.jpa.properties.hibernate.type.preferred_date_jdbc_type=91
spring.jpa.properties.hibernate.type.preferred_time_jdbc_type=92

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false

