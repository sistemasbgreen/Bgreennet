<div class="app-container">
  <!-- Header -->
  <header class="header">
    <!-- Icono del menú -->
    <div class="menu-toggle" 
         (click)="toggleSidebar()" 
         role="button" 
         tabindex="0"
         aria-label="Toggle sidebar"
         (keydown.enter)="toggleSidebar()">
      <i class="bi bi-list icon-menu"></i>
    </div>

    <!-- Logo -->
    <div class="logo">BGREEN</div>

    <!-- Sección usuario -->
    <div class="user-info">
      <span class="user-name">{{ user }}</span>

      <div class="user-dropdown" 
           (click)="toggleUserMenu()" 
           #userDropdown
           role="button"
           tabindex="0"
           aria-label="User menu"
           (keydown.enter)="toggleUserMenu()">
        <i class="bi bi-person-circle icon-user"></i>
        
        <!-- Dropdown menu -->
        <div class="dropdown-menu" *ngIf="isUserMenuOpen">
          <button (click)="home()" class="dropdown-item">
            <i class="bi bi-house-door"></i>
            <span>Home</span>
          </button>
          <button (click)="logout()" class="dropdown-item">
            <i class="bi bi-box-arrow-right"></i>
            <span>Cerrar Sesión</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <div class="main-layout">
    <!-- Sidebar -->
    <aside class="sidebar" 
           [class.collapsed]="isSidebarCollapsed"
           role="navigation"
           aria-label="Main navigation">
      <nav>
        <ul class="menu-list">
          <!-- Iterar sobre módulos dinámicos -->
          <li *ngFor="let modulo of modulos; let i = index" 
              class="menu-item" 
              [class.expanded]="modulo.expandido"
              [style.animation-delay]="(i * 0.05) + 's'">
            
            <!-- Header del módulo -->
            <div class="menu-header" 
                 (click)="toggleSubmodulos(modulo)"
                 role="button"
                 tabindex="0"
                 [attr.aria-expanded]="modulo.expandido"
                 [attr.aria-label]="'Toggle ' + modulo.nombre + ' submenu'"
                 (keydown.enter)="toggleSubmodulos(modulo)">
              <i [class]="modulo.icono" aria-hidden="true"></i>
              <span class="module-name" *ngIf="!isSidebarCollapsed">{{ modulo.nombre }}</span>
              <i class="arrow" 
                 [class.down]="modulo.expandido"
                 *ngIf="!isSidebarCollapsed && modulo.subModulos?.length"
                 aria-hidden="true">▼</i>
            </div>

            <!-- Submódulos -->
            <ul *ngIf="modulo.expandido && modulo.subModulos?.length" 
                class="submenu"
                role="menu"
                [attr.aria-label]="modulo.nombre + ' submenu'">
              <li *ngFor="let sub of modulo.subModulos" role="none">
                <a [routerLink]="[modulo.ruta, sub.ruta]" 
                   routerLinkActive="active" 
                   class="submenu-item"
                   role="menuitem"
                   [attr.aria-label]="sub.nombre">
                  <i [class]="sub.icono" aria-hidden="true"></i>
                  <span>{{ sub.nombre }}</span>
                </a>
              </li>
            </ul>
          </li>
        </ul>
      </nav>
    </aside>

    <!-- Contenido principal -->
    <main class="content-wrapper" role="main">
      <router-outlet></router-outlet>
    </main>

<!-- ===== MODAL CAMBIAR CLAVE (EXISTENTE) ===== -->
<div class="modal-overlay clave-modal-overlay" *ngIf="showChangePasswordModal" (click)="cerrarModalCambiarClave()">
  <div class="modal-tarea-container clave-modal-container" (click)="$event.stopPropagation()">

    <div class="modal-tarea-header">
      <h3>
        <i class="bi bi-key-fill"></i>
        Cambiar Clave
      </h3>
      <button class="btn-close" (click)="cerrarModalCambiarClave()">×</button>
    </div>

    <div class="modal-tarea-body">

      <!-- Clave actual -->
      <div class="form-group">
        <label>Clave actual <span class="required">*</span></label>
        <div class="password-input-wrapper">
          <input [type]="mostrarClaveActual ? 'text' : 'password'" class="form-input"
            placeholder="Ingresa tu clave actual" [(ngModel)]="claveActual" name="claveActual" />
          <button type="button" class="toggle-eye" (click)="mostrarClaveActual = !mostrarClaveActual">
            <i class="bi" [class.bi-eye]="!mostrarClaveActual" [class.bi-eye-slash]="mostrarClaveActual"></i>
          </button>
        </div>
      </div>

      <!-- Nueva clave -->
      <div class="form-group">
        <label>Nueva clave <span class="required">*</span></label>
        <div class="password-input-wrapper">
          <input [type]="mostrarNuevaClave ? 'text' : 'password'" class="form-input"
            placeholder="Ingresa tu nueva clave" [(ngModel)]="nuevaClave" name="nuevaClave" />
          <button type="button" class="toggle-eye" (click)="mostrarNuevaClave = !mostrarNuevaClave">
            <i class="bi" [class.bi-eye]="!mostrarNuevaClave" [class.bi-eye-slash]="mostrarNuevaClave"></i>
          </button>
        </div>
        <small class="match-hint" *ngIf="nuevaClave.length > 0 && claveActual.length > 0 && nuevaClave === claveActual">
          La nueva clave debe ser diferente a la actual
        </small>

        <!-- Indicadores de requisitos -->
        <div class="password-requirements" *ngIf="nuevaClave.length > 0">
          <span [class.req-ok]="tieneMayuscula" [class.req-fail]="!tieneMayuscula">
            <i class="bi" [class.bi-check-circle-fill]="tieneMayuscula" [class.bi-x-circle-fill]="!tieneMayuscula"></i>
            Mayúscula
          </span>
          <span [class.req-ok]="tieneMinuscula" [class.req-fail]="!tieneMinuscula">
            <i class="bi" [class.bi-check-circle-fill]="tieneMinuscula" [class.bi-x-circle-fill]="!tieneMinuscula"></i>
            Minúscula
          </span>
          <span [class.req-ok]="tieneNumero" [class.req-fail]="!tieneNumero">
            <i class="bi" [class.bi-check-circle-fill]="tieneNumero" [class.bi-x-circle-fill]="!tieneNumero"></i>
            Número
          </span>
          <span [class.req-ok]="tieneLongitud" [class.req-fail]="!tieneLongitud">
            <i class="bi" [class.bi-check-circle-fill]="tieneLongitud" [class.bi-x-circle-fill]="!tieneLongitud"></i>
            Mínimo 8 caracteres
          </span>
          <span [class.req-ok]="tieneCaracterEspecial" [class.req-fail]="!tieneCaracterEspecial">
            <i class="bi" [class.bi-check-circle-fill]="tieneCaracterEspecial"
              [class.bi-x-circle-fill]="!tieneCaracterEspecial"></i>
            Carácter especial (!@#$...)
          </span>
        </div>
      </div>

      <!-- Confirmar nueva clave -->
      <div class="form-group">
        <label>Confirmar nueva clave <span class="required">*</span></label>
        <div class="password-input-wrapper">
          <input [type]="mostrarConfirmarClave ? 'text' : 'password'" class="form-input"
            [class.input-error]="confirmarClave.length > 0 && !claveConfirmadaValida"
            [class.input-ok]="confirmarClave.length > 0 && claveConfirmadaValida" placeholder="Confirma tu nueva clave"
            [(ngModel)]="confirmarClave" name="confirmarClave" />
          <button type="button" class="toggle-eye" (click)="mostrarConfirmarClave = !mostrarConfirmarClave">
            <i class="bi" [class.bi-eye]="!mostrarConfirmarClave" [class.bi-eye-slash]="mostrarConfirmarClave"></i>
          </button>
        </div>
        <small class="match-hint" *ngIf="confirmarClave.length > 0 && !claveConfirmadaValida">Las claves no
          coinciden</small>
      </div>

      <!-- Mensajes -->
      <div class="clave-error" *ngIf="errorClave">⚠️ {{ errorClave }}</div>
      <div class="clave-success" *ngIf="successClave">✅ {{ successClave }}</div>

    </div>

    <div class="modal-tarea-footer">
      <button class="btn-cancelar" (click)="cerrarModalCambiarClave()">Cancelar</button>
      <button class="btn-guardar" (click)="guardarClave()"
        [disabled]="!claveActual || !passwordValido || !claveConfirmadaValida || !esDiferenteDeActual">
        <i class="bi bi-shield-lock"></i>
        Guardar Clave
      </button>
    </div>

  </div>
</div>

  </div>
</div>
