<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BGREENNET</title>

</head>

<body>
  <header class="header">
    <div class="logo-section">
      <img src="http://172.30.72.200/Imagenes/Img/bgreen_Logo.jpg" width="100px" alt="">
      <div class="stats">
        <div class="stat-item">
          <span>📊 TRM: $ 3,877.26</span>
        </div>
        <div class="stat-item">
          <span>💰 CPD FEP: $ 4,929.994</span>
        </div>
        <div class="stat-item">
          <span>📈 BTCD: $ 19,367.00</span>
        </div>
      </div>
    </div>
    <div class="brand">
      <h1>BGREEN<span>NET</span></h1>
    </div>
    <div class="nav">
      <a href="#">📧 Contactos</a>
      <a href="#">📋 Formatos</a>
      <button class="search-btn">🔍</button>

      <button class="user-avatar" (click)="toggleMenu()">
        {{ initials }}
      </button>
    </div>
  </header>

     <div class="dropdown-menu" *ngIf="isMenuOpen">
        <div class="headername">
          <div class="avatar">{{ initials }}</div>
          <div class="greeting">
            <p>¡Hola, {{ fullName }}!</p>
            <p>{{ nameempresa }}</p>
          </div>
        </div>
        <div class="footer" (click)="logout()">
          <span>→</span> Cerrar sesión
        </div>
      </div>

  <main class="main-content">

<!--
    <section>
      <img src="http://172.30.72.200/Imagenes/Img/JLF_1190%20(1).JPG" width="800px" height="500px" alt="">
    </section>
-->    

    <section>
      <div class="apps-grid">
        <div class="apps-container">


          <div *ngFor="let s of sistemaInformacionData" class="app-item">
            <a [href]="s.url" target="_blank" rel="noopener noreferrer" class="app-link">
              <img [src]="s.imagenUrl" [alt]="s.nombre" width="100" height="100" />
              <span class="app-name">{{ s.nombre }}</span>
            </a>
          </div>


        </div>
      </div>
    </section>

  </main>
<footer>
  <div class="carousel">
    <img
      *ngFor="let img of images"
      [src]="img"
      [alt]="'Imagen'"
      (click)="openModal(img)"
    />
  </div>
</footer>

<!-- Modal -->
<div
  *ngIf="showModal"
  class="modal"
  (click)="onModalClick($event)"
>
  <span class="close" (click)="closeModal()">&times;</span>
  <img [src]="selectedImage!" alt="Imagen ampliada" />
</div>

</body>

</html>
