    <text x="14" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#64748b">Asistente de IA de Anthropic.</text>
    <rect x="14" y="78" width="177" height="22" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
