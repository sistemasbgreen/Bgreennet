<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="100%" height="100%">
  <defs>
    <filter id="headerShadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
    <filter id="glowIa" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#16a34a" flood-opacity="0.8"/>
    </filter>
    <linearGradient id="iaGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="540" fill="#f8fafc"/>

  <!-- Page Header Mockup Container -->
  <g filter="url(#headerShadow)">
    <rect x="30" y="30" width="740" height="74" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
  </g>

  <!-- Logo Section -->
  <text x="50" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="#0f172a">BGREEN<tspan fill="#16a34a">NET</tspan></text>
  
  <!-- TRM indicator -->
  <rect x="180" y="52" width="105" height="28" rx="6" fill="#f1f5f9"/>
  <text x="190" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#475569">📊 TRM: $ 3,877</text>

  <!-- Search bar -->
  <rect x="300" y="50" width="130" height="32" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="312" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">🔍 Buscar...</text>

  <!-- Navigation items -->
  <circle cx="455" cy="67" r="15" fill="#f1f5f9"/>
  <text x="455" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">🌙</text>

  <circle cx="495" cy="67" r="15" fill="#f1f5f9"/>
  <text x="495" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">🔔</text>

  <circle cx="535" cy="67" r="15" fill="#f1f5f9"/>
  <text x="535" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">📅</text>

  <!-- ============================================== -->
  <!-- BOTÓN IA SEÑALADO / MARCADO                   -->
  <!-- ============================================== -->
  <g transform="translate(565, 47)">
    <!-- Outer Glow Box -->
    <rect x="-8" y="-8" width="56" height="56" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="5,3" filter="url(#glowIa)"/>
    
    <!-- The IA Button itself -->
    <rect x="0" y="0" width="40" height="40" rx="10" fill="url(#iaGrad)"/>
    <text x="20" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="900" fill="#ffffff" text-anchor="middle">IA</text>
  </g>

  <!-- Botón 2027 -->
  <rect x="625" y="47" width="55" height="40" rx="10" fill="#0a5c2e"/>
  <text x="652" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">🚀 2027</text>

  <!-- User Avatar -->
  <circle cx="715" cy="67" r="18" fill="#15803d"/>
  <text x="715" y="73" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">JA</text>

  <!-- ============================================== -->
  <!-- LLAMADO VISUAL / INDICADOR APUNTADOR          -->
  <!-- ============================================== -->
  <!-- Callout Arrow -->
  <path d="M585 170 L585 125" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/>
  <polygon points="585,115 578,130 592,130" fill="#16a34a"/>

  <!-- Explanatory Callout Card -->
  <g filter="url(#headerShadow)">
    <rect x="360" y="170" width="380" height="90" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  </g>
  <rect x="380" y="185" width="28" height="28" rx="8" fill="#dcfce7"/>
  <text x="394" y="204" font-family="system-ui, -apple-system, sans-serif" font-size="14" text-anchor="middle">✨</text>

  <text x="420" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#0f172a">Botón "IA" en la Barra Superior</text>
  <text x="420" y="218" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#475569">
    Haz clic en el botón verde con letras blancas <tspan font-weight="700" fill="#15803d">"IA"</tspan>
  </text>
  <text x="420" y="234" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">
    para desplegar el catálogo completo de herramientas inteligentes.
  </text>

  <!-- Simulated Background Dashboard below -->
  <rect x="30" y="290" width="450" height="210" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="50" y="322" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#0f172a">Mis Accesos Rápidos</text>
  <rect x="50" y="340" width="90" height="65" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="155" y="340" width="90" height="65" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="260" y="340" width="90" height="65" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="365" y="340" width="90" height="65" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>

  <rect x="500" y="290" width="270" height="210" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="520" y="322" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#0f172a">Calendario &amp; Eventos</text>
  <rect x="520" y="340" width="230" height="35" rx="6" fill="#f1f5f9"/>
  <rect x="520" y="385" width="230" height="35" rx="6" fill="#f1f5f9"/>
</svg>
