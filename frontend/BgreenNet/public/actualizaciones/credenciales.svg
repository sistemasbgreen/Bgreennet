<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="100%" height="100%">
  <defs>
    <filter id="shadow1" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="540" fill="url(#bgGrad)"/>
  
  <!-- Subtle background mockup hints -->
  <rect x="40" y="40" width="720" height="460" rx="12" fill="#1e293b" opacity="0.6"/>
  <rect x="70" y="70" width="220" height="24" rx="4" fill="#475569" opacity="0.4"/>
  <rect x="70" y="110" width="660" height="2" fill="#334155"/>

  <!-- Modal Container -->
  <g filter="url(#shadow1)">
    <rect x="170" y="60" width="460" height="420" rx="16" fill="#ffffff"/>
  </g>

  <!-- Close button X -->
  <text x="595" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#94a3b8" font-weight="bold" cursor="pointer">×</text>

  <!-- Header Icon: Key -->
  <g transform="translate(205, 85)">
    <circle cx="16" cy="16" r="16" fill="#fef3c7"/>
    <path d="M12 16a4 4 0 1 1 7.465-2H26v3h-3v3h-3v-2.535A4 4 0 0 1 12 16z" fill="#d97706"/>
  </g>

  <!-- Title & Subtitle -->
  <text x="248" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#0f172a">Recuperar Contraseña</text>
  <text x="248" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#64748b">Restablecimiento mediante código dinámico a su correo</text>

  <!-- Stepper Bar -->
  <!-- Step 1: Active -->
  <circle cx="230" cy="165" r="14" fill="#16a34a"/>
  <text x="230" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="230" y="193" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#16a34a" text-anchor="middle">Solicitud</text>

  <!-- Line 1-2 -->
  <line x1="252" y1="165" x2="378" y2="165" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Step 2 -->
  <circle cx="400" cy="165" r="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="400" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#64748b" text-anchor="middle">2</text>
  <text x="400" y="193" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">Código OTP</text>

  <!-- Line 2-3 -->
  <line x1="422" y1="165" x2="548" y2="165" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Step 3 -->
  <circle cx="570" cy="165" r="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="570" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#64748b" text-anchor="middle">3</text>
  <text x="570" y="193" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">Nueva Clave</text>

  <!-- Description paragraph -->
  <text x="205" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#475569">
    <tspan x="205" dy="0">Ingrese su usuario o correo electrónico corporativo registrado para</tspan>
    <tspan x="205" dy="18">enviarle un código de verificación de 6 dígitos.</tspan>
  </text>

  <!-- Form Field -->
  <text x="205" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1e293b">Usuario o Correo</text>
  
  <rect x="205" y="307" width="390" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- Mail Icon -->
  <g transform="translate(218, 321)" stroke="#94a3b8" stroke-width="1.5" fill="none">
    <rect width="18" height="14" rx="2"/>
    <path d="M0 2l9 7 9-7"/>
  </g>
  <text x="246" y="334" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b">Ej. jangulo o correo@bgreen.com.co</text>

  <!-- Action Buttons -->
  <rect x="205" y="380" width="85" height="42" rx="8" fill="#f1f5f9"/>
  <text x="247" y="406" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">Cancelar</text>

  <rect x="305" y="380" width="290" height="42" rx="8" fill="url(#btnGrad)"/>
  <text x="450" y="406" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Enviar Código</text>
</svg>
